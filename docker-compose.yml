services:
  postgres:
    image: postgres:16-alpine
    container_name: bluper-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: bluper
      POSTGRES_PASSWORD: '123'
      POSTGRES_DB: bluper
    volumes:
      - bluper_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bluper -d bluper']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: bluper-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - bluper_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  bluper_postgres_data:
  bluper_redis_data:
